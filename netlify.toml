[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# No SPA catch all any more. Every real route is prerendered to its own
# index.html by scripts/prerender.ts, so deep links are real files, and anything
# else gets dist/404.html with an honest 404 instead of the home page with a 200.
